# Conda environment specification for HGT reproducibility
# ===========================================================
# All software versions are pinned to match the manuscript
# "Horizontal Gene Transfer from Fungi to Myxozoa" (Ibrahim & Adriano)
#
# Create the environment with:
#   conda env create -f HGT_environment.yml
#   conda activate hgt-phylogenetics
#
# Tested on Linux x86_64 (Ubuntu 20.04) and macOS 13+ Apple Silicon (via Rosetta).

name: hgt-phylogenetics
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # === Core languages ===
  - python=3.11
  - r-base=4.3
  - pip

  # === Sequence search / annotation ===
  - blast=2.12.0
  - hmmer=3.3.2
  - samtools=1.18
  - bedtools=2.31

  # === Multiple sequence alignment / trimming ===
  - mafft=7.471
  - trimal=1.4.rev15

  # === Phylogenetic inference ===
  - iqtree=2.1.3
  - mrbayes=3.2.7
  - beast2=2.6.3
  - beagle=4.0.0
  - tracetools=1.7.2         # loganalyser
  - treeannotator=2.6.3      # bundled with beast2

  # === Contamination screening ===
  - kraken2=2.1.2
  - blobtools=1.1.1

  # === RNA-seq / Expression ===
  - trimmomatic=0.39
  - trinity=2.11.0
  - salmon=1.4.0
  - subread=2.0.3

  # === Visualization ===
  - figtree=1.4.4
  - ggtree=3.6.2
  - r-ggplot2=3.4.2
  - r-reshape2=1.4.4
  - r-tidyverse=2.0.0
  - r-dplyr=1.1.2
  - r-phytools=1.5.1
  - r-ape=5.7

  # === Differential expression & GO enrichment ===
  - bioconductor-deseq2=1.40.1
  - bioconductor-topgo=2.52.0

  # === Python dependencies (custom scripts) ===
  - pip
  - pandas=2.1.3
  - numpy=1.26.2
  - scipy=1.11.3
  - matplotlib=3.8.1
  - seaborn=0.13.0
  - biopython=1.81
  - ete3=3.1.3
  - dendropy=4.6.1
  - openpyxl=3.1.2
